[-1,'🗺️','அரசியல் கருத்து முரண்பாடு & எல்லைப் பிரச்சினை',['எ.கா: பாலஸ்தீன நிலப்பரப்பின் மீதான இஸ்ரேலின் ஆக்கிரமிப்பு மற்றும் எல்லைப் போர்கள்.'],0,0,'பாலஸ்தீனம்'],
[-1,'💸','சமூக பொருளாதார நிலைமைகள் & வறுமை',['எ.கா: சோமாலியா, எதியோப்பியா ஆகிய நாடுகளில் எழும் உள்நாட்டு மோதல்கள்.'],0,0,'சோமாலியா · எதியோப்பியா'],
[-1,'🛢️','வளப் போட்டி',['எ.கா: மத்திய கிழக்கு நாடுகளின் எண்ணெய் வளத்தைக் கைப்பற்ற வல்லரசு நாடுகள் தொடுக்கும் போர்கள்.'],0,0,'எண்ணெய் வளம்'],
[-1,'🕎','சமயக் கொள்கை வேறுபாடுகள்',['சமயக் கொள்கை வேறுபாடுகளும் ஏனைய சமயங்களை மதிக்காமையும்.','எ.கா: வரலாற்று ரீதியான சிலுவைப் போர்கள், கத்தோலிக்க – புரட்டஸ்தாந்து பிரிவுகளிடையேயான மோதல்கள்.'],0,0,'சிலுவைப் போர்கள்']]}},
{t:'5. மோதலின் விளைவுகள்: சாதகம் × பாதகம்',tb:1,pair:1,cw:[50,50],h:['✅ சாதகமான விளைவுகள் (Positive Impacts)','⚠️ பாதகமான விளைவுகள் (Negative Impacts)'],r:[
['நீண்டகாலப் பிரச்சினைகளுக்குத் தீர்வு காணல்: சமூகத்தில் மறைந்து கிடக்கும் பிணக்குகளை வெளிக்கொணர்ந்து அவற்றுக்குத் தீர்வு காணும் நகர்வை ஏற்படுத்துதல்.','உயிர்ச் சேதங்களும் காயங்களும்: எண்ணற்ற மனித உயிர்கள் பலியாதல் மற்றும் உடற்காயங்கள் ஏற்படுதல்.'],
['ஆக்கபூர்வமான சமூக மாற்றங்கள்: சமூகத்தில் நிலவும் அநீதிகளைக் களைந்து புதிய சட்டங்கள் மற்றும் சீர்திருத்தங்கள் உருவாக வழியமைத்தல்.','சொத்துக்கள் மற்றும் சுற்றாடல் அழிவு: கட்டிடங்கள், தொழிற்சாலைகள், இயற்கை வளங்கள் மற்றும் உள்கட்டமைப்புகள் நாசமாதல் (எ.கா: காசா, லிபியா, சிரியா போரழிவுகள்).'],
['சமூக நல்லிணக்க விழிப்புணர்வு: மோதலின் கொடூரத்தைப் புரிந்து கொண்டு எதிர்காலத்தில் அமைதியைப் பேண பிரஜைகளிடையே விழிப்புணர்வு ஏற்படுதல்.','உளவியல் பாதிப்புகள்: தனிநபர்களிடையே பயம், சந்தேகம், பதற்றம், விரக்தி மற்றும் மனநோய் நிலைகள் தோன்றுதல்.'],
['புதிய உடன்பாடுகள் எட்டப்படல்: இரு தரப்பாரும் பேச்சுவார்த்தை மூலம் புதிய சமரச ஒப்பந்தங்களை உருவாக்கி ஒருங்கிணைதல்.','பொருளாதார மற்றும் அரசியல் சீர்குலைவு: உற்பத்தி முடங்குதல், வறுமை அதிகரித்தல், அகதிகள் பிரச்சினை மற்றும் அரசியல் ஸ்திரமின்மை தோன்றுதல்.']]},
{t:'6. மோதலைத் தீர்க்கும் பிரதான வழிமுறைகள்',mm:{cols:1,c:['🕊️','மோதலைத் தீர்க்கும் வழிமுறைகள்','வன்முறையின்றி · அமைதியாக'],
l:[
[-1,'💬','1. கலந்துரையாடல் / பேச்சுவார்த்தை',['மோதலுக்குரிய தரப்பினர் நேரடியாகவோ அல்லது மத்தியஸ்தர் மூலமாகவோ பேச்சுவார்த்தை நடத்தி, இரு தரப்பிற்கும் வெற்றி (Win-Win Strategy) தரும் தீர்வைக் காணுதல்.'],0,0,'Negotiation · Win-Win'],
[-1,'🤝','2. பேரம் பேசும் முறை (Bargaining)',['தொழிற்சங்கங்கள் மற்றும் தொழில்தருநர்களிடையே காணப்படும் தொழில் சார்ந்த மோதல்களைத் தீர்க்கப் பயன்படும் முறை.','பண்புகள்: இரு தரப்பும் ஒரே மேஜையில் அமர்ந்து சகிப்புத்தன்மையுடன் பேசி, விட்டுக்கொடுப்புகள் மூலம் இணக்கப்பாட்டு ஒப்பந்தத்தை (Collective Agreement) எட்டுதல்.'],0,0,'தொழிற்சங்கம் · தொழில்தருநர்'],
[-1,'🧑‍⚖️','3. மத்தியஸ்தம் (Mediation)',['பேச்சுவார்த்தை தோல்வியடையும்போது, சுயாதீனமான 3ஆம் தரப்பு (மத்தியஸ்தர்) தலையிட்டு அமைதியான முறையில் தீர்வுகாண உதவுதல்.','எ.கா: குடும்பப் பிணக்குகள், காணிப் பிணக்குகள், இன/பிராந்திய மோதல்கள்.'],0,0,'சுயாதீன 3ஆம் தரப்பு'],
[-1,'🏘️','4. இணக்க சபை (Conciliation Boards)',['இலங்கையில் கிராம/பிரதேச மட்டத்தில் நிலவும் சிறு பிணக்குகளை இணக்க சபைகள் மூலம் நீதிமன்றத்திற்குச் செல்லாமல் சுமுகமாகத் தீர்த்து வைத்தல்.'],0,0,'கிராம / பிரதேச மட்டம்'],
[-1,'🧮','5. காப்பாற்றும் முறை (Arbitration)',['நிபுணத்துவம் வாய்ந்த மீட்பாளர் (Arbitrator) இரு தரப்பின் வாக்குமூலங்களையும் செவிமடுத்துத் தீர்ப்பை வழங்குவார்.','இதில் ஒரு தரப்பு வெற்றியும் ஒரு தரப்பு தோல்வியும் (Win-Lose Strategy) அடையும்.'],0,0,'Win-Lose'],
[-1,'⚖️','6. நீதிமன்றத் தீர்ப்புக்கூறல் (Litigation)',['நாட்டின் சட்டத்தின் ஆட்சிக்கு அமைவாக நீதிமன்றத்தின் மூலம் வழக்கினை விசாரணை செய்து இறுதித் தீர்ப்பு வழங்குதல்.','பண்புகள்: இரு தரப்பும் சட்டத்திற்கு உட்படுதல் வேண்டும்; தோல்வியுற்ற தரப்பு வழக்குகளுக்கான செலவை ஏற்க வேண்டும்; மேன்முறையீடு செய்யும் உரிமை உண்டு.'],0,0,'சட்டத்தின் ஆட்சி'],
[-1,'✍️','7. உடன்படுதல் (Agreement)',['3ஆம் தரப்பின் உதவியுடன் இரு தரப்பும் ஒப்பந்தத்தில் கையெழுத்திட்டு மோதலைக் குறைத்தல்.','எ.கா: தொழிலாளர்–முதலாளி ஒப்பந்தங்கள்.'],0,0,'ஒப்பந்தம்'],
[-1,'🗣️','8. ஆலோசனையும் வழிகாட்டலும்',['உளவியல் நிபுணர்கள் அல்லது ஆலோசகர்கள் மூலம் தனிநபர் மற்றும் குடும்ப மோதல்களுக்கு மாற்று வழிகளையும் அழுத்தக் குறைப்பு ஆலோசனைகளையும் வழங்குதல்.'],0,0,'Counseling & Guidance']]}},
{t:'ஒப்பீடு: மோதலைத் தீர்க்கும் பிரதான முறைகள்',tb:1,tc:'t24',cw:[13,22,22,22,21],h:['ஒப்பீட்டு அம்சம்','💬 பேச்சுவார்த்தை / பேரம் பேசுதல்','🧑‍⚖️ மத்தியஸ்தம் / இணக்க சபை','🧮 காப்பாற்றும் முறை (Arbitration)','⚖️ நீதிமன்றத் தீர்ப்புக்கூறல்'],r:[
['மூன்றாம் தரப்பின் பங்கு','நேரடியாக இரு தரப்பும் பேசுவர் (மூன்றாம் தரப்பு இல்லை அல்லது குறைந்த பங்கு).','நடுநிலையான 3ஆம் தரப்பு வழிகாட்டுவார்; தீர்ப்பைத் திணிக்கமாட்டார்.','நிபுணத்துவம் வாய்ந்த மீட்பாளர் விசாரித்துத் தீர்ப்பு வழங்குவார்.','நீதிபதி சட்டத்தின் அடிப்படையில் கட்டாயத் தீர்ப்பு வழங்குவார்.'],
['முடிவின் தன்மை','பரஸ்பர விட்டுக்கொடுப்பு மூலம் இரு தரப்பும் ஏற்கும் உடன்பாடு.','இணக்கமான சமரச ஒப்பந்தம்.','மீட்பாளரின் தீர்ப்பு (ஒரு தரப்பு வெற்றி, ஒரு தரப்பு தோல்வி).','நீதிமன்றத்தின் சட்டப்பூர்வமான இறுதித் தீர்ப்பு (சட்டத்திற்கு கட்டுப்பட வேண்டும்).'],
['அணுகுமுறை உத்தி','Win – Win Strategy (இரு தரப்பிற்கும் வெற்றி)','Win – Win Strategy (இரு தரப்பிற்கும் வெற்றி)','Win – Lose Strategy (ஒரு தரப்பு வெற்றி, ஒரு தரப்பு தோல்வி)','Win – Lose Strategy (சட்டப்பூர்வ வெற்றி / தோல்வி)'],
['பொருந்தும் சந்தர்ப்பங்கள்','தொழிற்சங்கப் பிரச்சினைகள், குடும்ப ஒப்பந்தங்கள்.','அயலவர் பிணக்குகள், சமூகப் பிரச்சினைகள், மாகாண/பிராந்திய மோதல்கள்.','நிதிப் பிணக்குகள், ஒழுக்காற்று நடவடிக்கைகள், தொழில் நிறுவனப் பிணக்குகள்.','குற்றவியல் வழக்குகள், காணி உரிமை வழக்குகள், அரசியலமைப்பு முரண்பாடுகள்.']]},
{t:'7. மோதலைத் தவிர்க்கத் தனிநபரிடம் இருக்க வேண்டிய பண்புகள்',mm:{cols:1,c:['🌟','தனிநபரின் சமூகப் பண்புகள்','மோதலைத் தவிர்க்க'],
l:[
[-1,'🧘','எதையும் தாங்கும் சக்தி & பொறுமை',['உணர்ச்சிகளைக் கட்டுப்படுத்தி நிதானமாகத் தொழிற்படுதல்.'],0,0,'நிதானம்'],
[-1,'👂','செவிமடுத்தல் & மதிப்பளித்தல்',['பிறர் கருத்துக்களுக்கு மதிப்பளித்தல்: மாற்றுக் கருத்துக்களைக் கேட்டுப் புரிந்து கொள்ளல்.'],0,0,'பிறர் கருத்துக்கு மதிப்பு'],
[-1,'🕊️','நீதி, நேர்மை & அகிம்சை',['வன்முறையைத் தவிர்த்து நேர்மையாகச் செயற்படுதல்.'],0,0,'வன்முறையைத் தவிர்த்தல்'],
[-1,'🤲','தியாகம் & விட்டுக்கொடுக்கும் மனப்பான்மை',['பொது நலனுக்காகச் சுய விருப்பங்களைச் சில வேளைகளில் விட்டுக்கொடுத்தல்.'],0,0,'பொது நலன்'],
[-1,'🏅','வெற்றி தோல்விகளைச் சமமாக ஏற்றல்',['விளையாட்டு மற்றும் அரசியல் களங்களில் சகிப்புத்தன்மையைப் பேணல்.'],0,0,'சகிப்புத்தன்மை'],
[-1,'🗨️','பயனுள்ள தொடர்பாடல்',['Effective Communication: தெளிவான உரையாடல் மூலம் தவறான புரிதல்களைத் தவிர்த்தல்.'],0,0,'தவறான புரிதலைத் தவிர்த்தல்']]}},
{t:'8. மோதலைச் சமாதானமாகத் தீர்ப்பதன் பயன்கள்',tb:1,cw:[24,76],h:['பயன்கள் பரிமாணம்','அடங்கும் பிரதான நன்மைகள்'],r:[
['👨‍👩‍👧 1. தனிநபர் & குடும்ப மட்டம்','உயிர் ஆபத்துக்கள் தவிர்க்கப்படல், உளவியல் பதற்றம் குறைந்து மன அமைதி ஏற்படுதல், சுயகௌரவம் பாதுகாக்கப்படல், குடும்ப ஒருமைப்பாடு வலுப்பெறுதல்.'],
['🏘️ 2. சமூக & பொருளாதார மட்டம்','வன்முறைகள் தவிர்க்கப்பட்டு வளங்களும் சொத்துக்களும் பாதுகாக்கப்படல், இனங்களுக்கிடையே ஐக்கியமும் பரஸ்பர நம்பிக்கையும் வளர்தல், பொருளாதார ஸ்திரத்தன்மை ஏற்படுதல்.'],
['🌍 3. தேசிய & சர்வதேச மட்டம்','நாட்டில் அரசியல் ஸ்திரத்தன்மை நிலவுதல், நாட்டின் அபிவிருத்தி செயற்திட்டங்கள் தடையின்றி நகர்தல், பிராந்திய மற்றும் உலக அமைதி (Global Peace) உறுதிசெய்யப்படல்.']]}
];
var n=0,seen={};
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function mmGet(s,k){var m=s.mm;if(k=='c')return [m.c[0],m.c[1],m.c[3]];var l=m.l[k];return [l[1],l[2],l[3]]}
function mmHtml(s){
  var m=s.mm,L=m.l,cx=900,cy=360,nodes='',paths='',d=0,half=Math.ceil(L.length/2),pts=[];
  var cc=m.c[3]?' tile cn':' nd cn';
  nodes+='<'+(m.c[3]?'button':'div')+' class="'+cc.trim()+(seen[n+'-c']?' seen':'')+'" data-k="c" style="--c:#F5B841;left:'+cx+'px;top:'+cy+'px;width:'+(m.c[3]?420:400)+'px;--d:0s"><span>'+m.c[0]+' '+m.c[1]+'</span>'+(m.c[2]?'<small>'+m.c[2]+(m.c[3]?' · தொடுங்கள்':'')+'</small>':'')+'</'+(m.c[3]?'button':'div')+'>';
  (m.b||[]).forEach(function(b,i){
    paths+=path(cx,cy,b[2],b[3],b[4],.2);
    nodes+='<div class="tile nd" style="--c:'+b[4]+';left:'+b[2]+'px;top:'+b[3]+'px;width:290px;font-size:26px;--d:'+(.25+i*.1)+'s">'+b[0]+' '+b[1]+'</div>';
  });
  L.forEach(function(l,i){
    var x=l[4],y=l[5],c=COL[i%6],px=cx,py=cy;
    if(m.cols){var left=i<half,idx=left?i:i-half,cnt=left?half:L.length-half;x=left?215:1585;y=360+(idx-(cnt-1)/2)*140}
    if(l[0]>=0){px=m.b[l[0]][2];py=m.b[l[0]][3];c=m.b[l[0]][4]}
    pts.push([x,y]);if(!m.tri)paths+=path(px,py,x,y,c,.4+i*.05);
    nodes+='<button class="tile'+(seen[n+'-'+i]?' seen':'')+'" data-k="'+i+'" style="--c:'+c+';left:'+x+'px;top:'+y+'px;width:'+(m.cols?370:330)+'px;--d:'+(.4+i*.06).toFixed(2)+'s"><span>'+l[1]+' '+l[2]+'</span>'+(l[6]?'<small>'+l[6]+'</small>':'')+'</button>';
  });
  if(m.tri){for(var e=0;e<3;e++){var A=pts[e],B=pts[(e+1)%3];paths+='<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B[0]+'" y2="'+B[1]+'" stroke="#F5B841" stroke-width="6" stroke-dasharray="16 12" opacity=".75" style="animation:fade 1s both"/>'}}
  return '<div class="mm"><svg>'+paths+'</svg>'+nodes+'</div>';
}
function path(x1,y1,x2,y2,c,dl){var mx=(x1+x2)/2;return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" stroke="'+c+'" style="animation-delay:'+dl.toFixed(2)+'s"/>'}
function show(i){
  n=Math.max(0,Math.min(S.length-1,i));var s=S[n],h='',d=0,tot,hint='ஒவ்வொன்றையும் தொடுங்கள்';
  $('t').textContent=s.t;
  if(s.tb){
    tot=s.r.length;hint='ஒரு வரிசையைத் தொடுங்கள்';
    h='<table class="'+(s.pair?'pair ':'')+(s.ctr?'ctr ':'')+(s.tc||'')+'">'+(s.cw?'<colgroup>'+s.cw.map(function(w){return '<col style="width:'+w+'%">'}).join('')+'</colgroup>':'')+'<thead><tr>'+s.h.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+
    s.r.map(function(r,i2){return '<tr data-r="'+i2+'" class="'+(seen[n+'-'+i2]?'seen':'')+'" style="--d:'+(0.15*i2+.2).toFixed(2)+'s">'+r.map(function(c){return '<td'+(c.indexOf('🌿')==0?' class="has"':'')+'>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
  }else if(s.mm){
    tot=s.mm.l.length+(s.mm.c[3]?1:0);hint='ஒவ்வொரு கிளையையும் தொடுங்கள்';h=mmHtml(s);
  }else{
    tot=s.it.length;
    s.it.forEach(function(it,k){
      h+='<button class="tile '+(s.cls||'')+(seen[n+'-'+k]?' seen':'')+'" style="--c:'+COL[k%6]+';--d:'+(d+=.1).toFixed(2)+'s" data-k="'+k+'"><span class="ic">'+it[0]+'</span>'+it[1]+(it[3]?'<small>'+it[3]+'</small>':'')+'</button>';
      var brk=s.br&&s.br.indexOf(k)>-1;
      if(k<tot-1&&!(s.arrow&&brk)&&((s.sep&&s.sep[k])||s.arrow))h+='<span class="sep" style="--d:'+(d+=.1).toFixed(2)+'s">'+(s.arrow?'➜':s.sep[k])+'</span>';
      if(brk)h+='<span class="br"></span>';
    });
  }
  $('g').innerHTML=h;
  var c=0;for(var j=0;j<tot;j++)if(seen[n+'-'+j])c++;
  if(s.mm&&s.mm.c[3]&&seen[n+'-c'])c++;
  $('hint').textContent='👆 '+hint+' ('+c+'/'+tot+')';
  var dots='';for(var q=0;q<S.length;q++)dots+='<i data-n="'+q+'"'+(q==n?' class="on"':'')+'></i>';
  $('dots').innerHTML=dots;$('cnt').textContent=(n+1)+' / '+S.length;
  $('bar').style.width=((n+1)/S.length*100)+'%';
  $('pv').disabled=n==0;$('nx').disabled=n==S.length-1;
}
function open_(k,ic,name,lines,html){
  seen[n+'-'+k]=1;
  $('card').style.setProperty('--c',COL[(+k||0)%6]);
  $('ci').textContent=ic;$('ch').textContent=name;
  $('cl').innerHTML=lines.map(function(l,j){return '<li style="animation-delay:'+(j*.12)+'s">'+(html?l:esc(l))+'</li>'}).join('');
  var len=lines.join('').length;
  $('card').className=len>520?'xs':len>300?'sm':'';
  $('pop').classList.add('show');
}
function close_(){$('pop').classList.remove('show');show(n)}
$('g').addEventListener('click',function(e){
  var b=e.target.closest('.tile'),r=e.target.closest('tr[data-r]'),s=S[n];
  if(b&&b.dataset.k!==undefined){var k=b.dataset.k,it=s.mm?mmGet(s,k):s.it[k];if(it[2])open_(k,it[0],it[1],it[2],0)}
  else if(r){var i=+r.dataset.r,row=s.r[i],nm,ls;
    if(s.pair){nm=row[0].split(':')[0]+' × '+row[1].split(':')[0];ls=row.map(function(c,j){return '<b>'+esc(s.h[j])+'</b>: '+esc(c)})}
    else{nm=row[0];ls=row.slice(1).map(function(c,j){return '<b>'+esc(s.h[j+1])+'</b>: '+esc(c)})}
    open_(i,s.pair?'⚖️':'🔍',nm,ls,1)}
});
$('pop').addEventListener('click',function(e){if(e.target.id=='pop'||e.target.id=='x')close_()});
$('pv').onclick=function(){show(n-1)};$('nx').onclick=function(){show(n+1)};
$('dots').addEventListener('click',function(e){if(e.target.dataset.n)show(+e.target.dataset.n)});
document.addEventListener('keydown',function(e){
  if(e.key=='Escape')close_();
  else if(!$('pop').classList.contains('show')){if(e.key=='ArrowRight')show(n+1);if(e.key=='ArrowLeft')show(n-1)}
});
var x0=null;
document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(x0===null||$('pop').classList.contains('show'))return;
  var dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>70)show(n+(dx<0?1:-1));
},{passive:true});
function fit(){
  var w=innerWidth,h=innerHeight,por=w/h<1,W=por?1080:1920,H=por?1920:1080,k=Math.min(w/W,h/H),cv=$('cv');
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.style.transform='translate('+(-W*k/2)+'px,'+(-H*k/2)+'px) scale('+k+')';
}
addEventListener('resize',fit);fit();
show(0);
</script>
</body>
</html>
